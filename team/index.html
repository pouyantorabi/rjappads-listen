async function open(){var pw=document.getElementById('p').value;var e=document.getElementById('e');e.textContent='';try{
var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.s),iterations:300000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.i)},k,b(D.c));try{sessionStorage.setItem('rjteam',pw)}catch(x){}
